COM_PHOCASEO_CONFIG_KEYWORD_VARIATIONS_DESC="Configure how keyword variations (inflections, declensions) are generated and used in SEO analysis."
COM_PHOCASEO_CONFIG_ENABLE_VARIATIONS_LABEL="Enable Keyword Variations"
COM_PHOCASEO_CONFIG_ENABLE_VARIATIONS_DESC="Enable matching of keyword variations for inflected languages. Useful for Czech, Slovak, Polish, Russian, etc. The system will recognize different word forms (e.g., 'soup' vs 'soups'). This improves keyword detection in titles, descriptions, and content analysis."
COM_PHOCASEO_CONFIG_VARIATION_STRATEGY_LABEL="Variation Strategy"
COM_PHOCASEO_CONFIG_VARIATION_STRATEGY_DESC="Choose how variations are generated:<br><strong>Suffix-based:</strong> Fast, offline, uses language patterns (recommended)<br><strong>AI-powered:</strong> Most accurate, requires AI API, slower<br><strong>Hybrid:</strong> Try AI first, fallback to suffix-based"
COM_PHOCASEO_STRATEGY_SUFFIX="Suffix-based (Fast, Offline)"
COM_PHOCASEO_STRATEGY_AI="AI-powered (Accurate, Requires API)"
COM_PHOCASEO_STRATEGY_HYBRID="Hybrid (AI + Suffix Fallback)"
COM_PHOCASEO_CONFIG_VARIATION_LANGUAGE_LABEL="Force Language"
COM_PHOCASEO_CONFIG_VARIATION_LANGUAGE_DESC="Override language detection. Leave empty to auto-detect from site language. Enter language code. Use this if your site is multilingual or if auto-detection is incorrect."
COM_PHOCASEO_CONFIG_VARIATIONS_IN_DEEP_ANALYSIS_LABEL="Include in AI Deep Analysis"
COM_PHOCASEO_CONFIG_VARIATIONS_IN_DEEP_ANALYSIS_DESC="When enabled, keyword variations will be sent to AI along with the main keyword during Deep Analysis. This helps AI understand context better for highly inflected languages."
COM_PHOCASEO_CONFIG_CUSTOM_PATTERNS_DIR_LABEL="Custom Language Patterns Directory"
COM_PHOCASEO_CONFIG_CUSTOM_PATTERNS_DIR_DESC="Path to custom language pattern JSON files (relative to site root). Default: media/com_phocaseo/language-patterns. Each language should have its own file (e.g., cs.json, sk.json). Leave empty to use built-in patterns."
COM_PHOCASEO_CONFIG_VARIATIONS_HELP_TITLE="<strong>How Keyword Variations Work</strong>"
COM_PHOCASEO_CONFIG_VARIATIONS_HELP_TEXT="<p><strong>What it does:</strong> Recognizes different grammatical forms of your focus keyword.</p><p><strong>Example (Czech):</strong><br>Focus keyword: <code>nabídka</code><br>Will also match: <code>nabídky</code>, <code>nabídku</code>, <code>nabídce</code>, <code>nabídkou</code></p><p><strong>Best for:</strong> Czech, Slovak, Polish, Russian, Croatian, German<br><strong>Less useful for:</strong> English, Dutch, Swedish<br><strong>Not applicable:</strong> Chinese, Japanese, Korean</p><p><strong>Performance:</strong> Suffix-based adds ~2-5ms per analysis. AI-powered is slower but more accurate.</p>"
